services:
  eur-thai-frontend:
    image: nginx:1.29.5-alpine3.23@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: eur-thai-frontend
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m
      - /var/run:rw,noexec,nosuid,nodev,size=1m
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.eur-thai-front.rule=Host(`eurthai.nomadprompters.es`)"
      - "traefik.http.routers.eur-thai-front.entrypoints=websecure"
      - "traefik.http.routers.eur-thai-front.tls.certresolver=myresolver"
      - "traefik.http.routers.eur-thai-front.priority=1"
      - "traefik.http.routers.eur-thai-front.middlewares=cloudflare-ips@file,rate-limit@docker,safe-headers@docker"
      - "traefik.http.services.eur-thai-front.loadbalancer.server.port=80"

networks:
  web:
    external: true
