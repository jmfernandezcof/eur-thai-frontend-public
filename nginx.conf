server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nunca registrar query strings: los enlaces de invitación llevan el token en la URL inicial.
  access_log off;

  # --- Cabeceras de seguridad (solo eurthai; Traefik safe-headers ya pone nosniff/XFO/HSTS/referrer) ---
  # CSP en ENFORCE. Auditada en navegador (Claude for Chrome, 2026-06-16): 0 violaciones en
  # modo publico + beta (traductor, audio TTS, modales y service worker).
  # Origenes: scripts propios; connect a /api,/data,/i18n,docs.google.com (form beta);
  # img/media data:+blob: (canvas/tts); style inline (badges menu); worker propio (sw.js).
  # Para re-auditar sin bloquear: cambiar el nombre de la cabecera a Content-Security-Policy-Report-Only.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://docs.google.com; worker-src 'self'; manifest-src 'self'" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # Bloquear acceso a dotfiles (.git, .gitignore, .env, etc.)
  location ~ /\. { deny all; return 404; }

  # Cache control para PWA
  location = /manifest.json { add_header Cache-Control "no-cache"; }
  location ~ ^/sw(?:-v[0-9]+)?[.]js$ { add_header Cache-Control "no-store, no-cache, must-revalidate"; expires -1; }

  # Servir ficheros, fallback a index.html (SPA-ish)
  location / { try_files $uri $uri/ /index.html; }

  # Compresion basica
  gzip on;
  gzip_types text/css application/javascript application/json text/html image/svg+xml;
}
